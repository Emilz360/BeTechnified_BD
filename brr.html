<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="brr.css">
    <title>regg.com</title>
</head>
<body>
     <div class="app-container">
             <aside class="sidebar">
                <div class="logo">REGG</div>
                <nav class="nav-menu">
                    <a href="#" class="nav-item active">Dashboard</a>
                    <a href="#" class="nav-item">Analytics</a>
                    <a href="#" class="nav-item">Projects</a>
                    <a href="#" class="nav-item">Settings</a>
                </nav>
             </aside>

          <main class="main content">
            <header class="top-header">
                <h1>Welcome Back, User</h1>
                <div class="user-profile">
                    <span class="user-name">Che Geraldine</span>
                    <div class="avatar"></div>
                </div>
            </header>

        <section class="dashboard-grid">
            <div class="card stat-card">
                <h3>Total Users</h3>
                <p class="stat-value">1,450</p>
                <span class="stat-trend positive">+12% this week</span>
            </div>

            <div class="card stat-card">
                <h3>Revenue</h3>
                <p class="stat-value">45,232 FCFA</p>
                <span class="stat-trend positive">+8% this week </span>
            </div>

            <div class="card stat-card">
                <h3>Active Tasks</h3>
                <p class="stat-value">18</p>
                <span class="stat-trend negative">-3% this week</span>
            </div>
        </section>

        <section class="data-section">
            <div class="card table-card">
                <h2>Recent Activities</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Status</th>
                            <th>Deadline</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Client Onboarding</td>
                            <td><span class="badge progress">In Progress</span></td>
                            <td>Oct 02, 2026</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section> 
          </main>   
     </div>
</body>
</html>
